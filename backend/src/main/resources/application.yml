spring:
  application:
    name: rede-krill-scheduling-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rede_krill}
    username: ${DB_USERNAME:redekrill}
    password: ${DB_PASSWORD:redekrill}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  thymeleaf:
    check-template-location: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:AD4rGbLMuVyPKUTpWwvnj0q3ZyhDuC6er6rmQE9+kNf4S5WL3Ysib9v+J4gdC1K0pWHLoKNLZuF+zjfSDpUcmA==}
    expiration: ${JWT_EXPIRATION:86400s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    from: ${MAIL_FROM:nao-responda@redekrill.com}
  seed:
    admin-name: ${SEED_ADMIN_NAME:Administrador}
    admin-email: ${SEED_ADMIN_EMAIL:admin@redekrill.com}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.redekrill.scheduling: INFO
