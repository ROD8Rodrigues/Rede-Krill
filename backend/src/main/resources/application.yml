spring:
  application:
    name: rede-krill-scheduling-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rede_krill}
    username: ${DB_USERNAME:redekrill}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  thymeleaf:
    check-template-location: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_ACCESS_EXPIRATION:15m}
  auth:
    access-cookie-name: ${AUTH_ACCESS_COOKIE:redekrill_access}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE:redekrill_refresh}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    expose-token-in-response: ${AUTH_EXPOSE_TOKEN_IN_RESPONSE:false}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  security:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    login-max-attempts-per-account: ${LOGIN_MAX_ATTEMPTS_ACCOUNT:5}
    login-max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_IP:20}
    login-window: ${LOGIN_WINDOW:15m}
    login-lockout: ${LOGIN_LOCKOUT:5m}
    session-expired-retention: ${SESSION_EXPIRED_RETENTION:7d}
    session-cleanup-enabled: ${SESSION_CLEANUP_ENABLED:true}
    session-cleanup-interval: ${SESSION_CLEANUP_INTERVAL:12h}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    from: ${MAIL_FROM:nao-responda@redekrill.com}
    outbox:
      enabled: ${EMAIL_OUTBOX_ENABLED:true}
      max-attempts: ${EMAIL_OUTBOX_MAX_ATTEMPTS:5}
      poll-interval-ms: ${EMAIL_OUTBOX_POLL_INTERVAL_MS:30000}
      initial-backoff-seconds: ${EMAIL_OUTBOX_INITIAL_BACKOFF_SECONDS:60}
      batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:20}
  seed:
    enabled: ${SEED_ADMIN_ENABLED:false}
    admin-name: ${SEED_ADMIN_NAME:Administrador}
    admin-email: ${SEED_ADMIN_EMAIL:admin@redekrill.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    require-password-change: ${SEED_ADMIN_REQUIRE_PASSWORD_CHANGE:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    # O springdoc monta /swagger-ui/** a partir de classpath:/META-INF/resources/webjars/swagger-ui/<versão>/.
    # Essa versão vem de <swagger-ui.version> no pom.xml (filtragem do spring-boot-starter-parent); sem ela,
    # o webjar fixado no pom não é localizado e as telas Swagger UI respondem 404.
    version: @swagger-ui.version@

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.redekrill.scheduling: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
