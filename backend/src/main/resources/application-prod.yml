spring:
  flyway:
    clean-disabled: true
  jpa:
    show-sql: false

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

app:
  auth:
    # Defaults de produção preservados e validados no boot pelo
    # ProductionConfigurationValidator; a env existe para o operador errar explícito.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    expose-token-in-response: ${AUTH_EXPOSE_TOKEN_IN_RESPONSE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  security:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:true}
  seed:
    enabled: ${SEED_ADMIN_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
